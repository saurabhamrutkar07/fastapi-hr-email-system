# Nginx: serves the React files and forwards /api/... to the API container. 
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Room for uploads (contact files, resume PDFs upto 5 MB)
    client_max_body_size 10m;

    # API: /api/auth/login -> http://api:8000/auth/login
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets its cookies for /auth; the brwser sees that as /api/auth
        proxy_cookie_path / /api/;
    }    

    # Built JS/CSS files have a hash in their names, so briwsers may cache them for long 
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable"; 
    }

    # Every other path is a page of the React app (/history, /settings, ...)
    location / {
        try_files $uri /index.html; 
    }
} 