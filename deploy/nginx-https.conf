# =============================================================================
# Nginx for the SERVER (HTTPS). Used only through docker-compose.prod.yml.
# The laptop keeps using frontend/nginx.conf (plain HTTP on localhost:8080).
# Certificates come from Let's Encrypt (certbot on the server) and are
# mounted read-only from /etc/letsencrypt.
# =============================================================================

# 1. Plain HTTP (port 80): send every request to the HTTPS address
server {
    listen 80;
    server_name _;
    return 301 https://saurabhamrutkar.com$request_uri;
}

# 2. https://www.saurabhamrutkar.com -> https://saurabhamrutkar.com (one address)
server {
    listen 443 ssl;
    http2 on;
    server_name www.saurabhamrutkar.com;

    ssl_certificate     /etc/letsencrypt/live/saurabhamrutkar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saurabhamrutkar.com/privkey.pem;

    return 301 https://saurabhamrutkar.com$request_uri;
}

# 3. The app over HTTPS 
server {
    listen 443 ssl;
    http2 on;
    server_name saurabhamrutkar.com; 

    ssl_certificate     /etc/letsencrypt/live/saurabhamrutkar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saurabhamrutkar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;


    # HSTS: the browser uses only HTTPS for this site for 1 day. 
    # Start small; raise it (e.g. 6 months) once HTTPS has run fine for a while. 
    add_header Strict-Transport-Security "max-age=86400" always;

    root /usr/share/nginx/html;
    index index.html;

    # Room for uploads (contact files, resume PDFs up to 5 MB)
    client_max_body_size 10m;

    # API: /api/auth/login -> http://api:8000/auth/login 
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets its cookies for /auth; the browser sees that as /api/auth
        proxy_cookie_path / /api/;
    }

    # Built JS/CSS have a hash in their names, so browsers may cache them long.
    # (add_header here replaces the server one, so HSTS is repeated.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # Every other path is a page of the React app (/history, /settings, ...)
    location / {
        try_files $uri /index.html;
    }
}