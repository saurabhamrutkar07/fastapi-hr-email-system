<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>ColdReach UI Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype toolbar + device stage. The app frame is a size container, so the
   Desktop / Tablet / Mobile switch shows the real sidebar → rail → bottom-nav layouts.
   Palette roles: brand navy = identity, nav, headings · primary blue = actions, links, focus ·
   teal = secondary highlights · green / amber / red = sent / pending / failed. */
:root{
  --stage:#E9EEF5; --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --line:#E2E8F0;
  --fg:#0F172A; --muted:#64748B;
  --brand:#1E3A8A; --brand-soft:#E5EBF8; --brand-ink:#1E3A8A; --brand-panel:#1E3A8A;
  --on-brand:#FFFFFF; --on-brand-muted:#C3CEEB; --on-brand-line:rgba(255,255,255,.16); --on-brand-card:rgba(255,255,255,.07); --on-brand-accent:#5EEAD4;
  --mark-bg:#1E3A8A; --mark-fg:#FFFFFF; --logo-dot:#0D9488; --logo-arrow:#FFFFFF;
  --primary:#2563EB; --primary-fg:#FFFFFF; --primary-soft:#DBEAFE; --link:#2563EB;
  --accent:#0D9488; --accent-soft:#CCFBF1; --accent-text:#0F766E;
  --ok:#16A34A; --ok-text:#15803D; --ok-soft:#DCFCE7;
  --warn:#D97706; --warn-text:#B45309; --warn-soft:#FEF3C7;
  --err:#DC2626; --err-text:#B91C1C; --err-soft:#FEE2E2;
  --scrim:rgba(15,23,42,.45); --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.07);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#050914; --bg:#0B1120; --surface:#111A2E; --surface-2:#18233B; --line:#253252;
  --fg:#E2E8F0; --muted:#94A3B8;
  --brand:#A5B8F3; --brand-soft:#1B2A55; --brand-ink:#DCE4FB; --brand-panel:#172C66;
  --on-brand:#FFFFFF; --on-brand-muted:#B9C6EC; --on-brand-line:rgba(255,255,255,.14); --on-brand-card:rgba(255,255,255,.06); --on-brand-accent:#5EEAD4;
  --mark-bg:#2B4DB3; --mark-fg:#FFFFFF; --logo-dot:#2DD4BF; --logo-arrow:#042F2E;
  --primary:#3B82F6; --primary-fg:#FFFFFF; --primary-soft:#172A4F; --link:#60A5FA;
  --accent:#2DD4BF; --accent-soft:#0F3B3A; --accent-text:#5EEAD4;
  --ok:#22C55E; --ok-text:#4ADE80; --ok-soft:#10301F;
  --warn:#F59E0B; --warn-text:#FBBF24; --warn-soft:#3A2A0C;
  --err:#EF4444; --err-text:#F87171; --err-soft:#3D1517;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#050914; --bg:#0B1120; --surface:#111A2E; --surface-2:#18233B; --line:#253252;
  --fg:#E2E8F0; --muted:#94A3B8;
  --brand:#A5B8F3; --brand-soft:#1B2A55; --brand-ink:#DCE4FB; --brand-panel:#172C66;
  --on-brand:#FFFFFF; --on-brand-muted:#B9C6EC; --on-brand-line:rgba(255,255,255,.14); --on-brand-card:rgba(255,255,255,.06); --on-brand-accent:#5EEAD4;
  --mark-bg:#2B4DB3; --mark-fg:#FFFFFF; --logo-dot:#2DD4BF; --logo-arrow:#042F2E;
  --primary:#3B82F6; --primary-fg:#FFFFFF; --primary-soft:#172A4F; --link:#60A5FA;
  --accent:#2DD4BF; --accent-soft:#0F3B3A; --accent-text:#5EEAD4;
  --ok:#22C55E; --ok-text:#4ADE80; --ok-soft:#10301F;
  --warn:#F59E0B; --warn-text:#FBBF24; --warn-soft:#3A2A0C;
  --err:#EF4444; --err-text:#F87171; --err-soft:#3D1517;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--stage);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--display);color:var(--brand-ink);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* prototype chrome */
.proto{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.proto-l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.proto h1{font-size:15px}
.proto small{color:var(--muted);font-size:12px}
.proto-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.proto select{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;font-weight:600;max-width:100%}
.stage{padding:16px;display:flex;justify-content:center}
.device{width:100%;max-width:1280px;height:clamp(560px,calc(100dvh - 110px),880px);container:app / inline-size;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);transition:max-width .3s ease}
.device[data-size="tablet"]{max-width:768px}
.device[data-size="mobile"]{max-width:390px;border-radius:26px}

/* app shell */
.app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
.side{display:none}
.top{grid-column:-2/-1;grid-row:1;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.main{grid-column:-2/-1;grid-row:2;overflow:auto;padding:20px 16px 28px;min-width:0}
.bottom{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.bottom button[aria-current="page"]{color:var(--brand)}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.top-title{font-family:var(--display);font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-search{display:none;align-items:center;gap:8px;flex:1;max-width:420px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 10px;color:var(--muted)}
.top-search input{border:0;background:transparent;padding:8px 0;width:100%;outline:none}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12.5px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;color:var(--brand-ink)}
.logo{width:32px;height:32px;flex:none;display:block}
.lg-bg{fill:var(--mark-bg)}
.lg-env{fill:var(--mark-fg)}
.lg-cut{fill:none;stroke:var(--mark-bg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg-dot{fill:var(--logo-dot);stroke:var(--mark-bg);stroke-width:1.8}
.lg-arrow{fill:none;stroke:var(--logo-arrow);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand-name b{font-weight:inherit;color:var(--primary)}

.side{flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--line);padding:14px 12px;min-height:0;overflow:auto}
.side .brand{padding:4px 0 12px;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px}
.grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--line)}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;font-size:13px}
.side-foot .who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* rail mode (tablet): icons only */
.side .nav-label,.side .grp,.side .who,.side .brand-name{display:none}
.side .nav a{justify-content:center}
.side .side-foot{flex-direction:column}

@container app (min-width:640px){
  .app{grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{display:flex;grid-column:1;grid-row:1/-1}
  .bottom,.menu-btn,.brand-m{display:none}
  .top{padding:12px 24px}
  .main{padding:24px}
  .top-search{display:flex}
  .top-title{display:none}
  .top .spacer{flex:1}
}
@container app (min-width:1024px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .side .nav-label,.side .grp,.side .who,.side .brand-name{display:block}
  .side .nav a{justify-content:flex-start}
  .side .brand{justify-content:flex-start;padding:4px 6px 12px}
  .side .side-foot{flex-direction:row}
  .main{padding:28px 32px 36px}
}

/* drawer + modal (inside the app frame) */
.overlay{position:absolute;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.drawer-o{justify-content:flex-start;align-items:stretch}
.drawer{width:min(290px,84%);background:var(--surface);height:100%;padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.drawer .nav-label,.drawer .grp{display:block}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px}
.sheet{background:var(--surface);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px 18px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-head h3{font-size:19px}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
@container app (min-width:640px){
  .overlay:not(.drawer-o){align-items:center;padding:24px}
  .sheet{max-width:540px;border-radius:14px;padding:24px}
}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.08)}
.btn-danger{color:var(--err-text)}
.btn-block{width:100%}
.btn-sm{padding:6px 10px;font-size:12.5px}
.link{color:var(--link);font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-pad{padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:15.5px}
.ph{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.ph h2{font-size:22px}
.ph p{margin:2px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
@container app (min-width:640px){.ph h2{font-size:26px}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok-text)}
.pill.ok::before{background:var(--ok)}
.pill.err{background:var(--err-soft);color:var(--err-text)}
.pill.err::before{background:var(--err)}
.pill.warn{background:var(--warn-soft);color:var(--warn-text)}
.pill.warn::before{background:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.pill.plain::before{display:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input[readonly]{background:var(--surface-2);color:var(--muted)}
.textarea{min-height:260px;resize:vertical;line-height:1.6}
.fgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:560px){.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.sec-t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.sec-t:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.chip svg.i{width:13px;height:13px}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--surface)}
.tag-input input{border:0;outline:none;background:none;flex:1;min-width:90px;padding:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;flex:1 1 220px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 10px;color:var(--muted)}
.search input{border:0;outline:none;background:none;padding:9px 0;width:100%;color:var(--fg)}
.toolbar .select{flex:0 1 200px;width:auto}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--primary-soft);color:var(--fg);font-size:13.5px}
.callout svg{color:var(--primary);margin-top:2px}
.callout.err{background:var(--err-soft)}
.callout.err svg{color:var(--err)}
.ini{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:12px;background:var(--surface-2);color:var(--fg);flex:none}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@container app (min-width:640px){.toast{bottom:24px}}

/* tables vs cards */
.app .only-wide{display:none}
.top .spacer{flex:1}
td.num{white-space:nowrap}
@container app (min-width:900px){.app .only-wide{display:block}.app .only-narrow{display:none}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person > div b{display:block;font-weight:600}
.person > div span{display:block;color:var(--muted);font-size:12.5px}
.ctl{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.clist{display:grid;gap:10px}
.citem{padding:14px;display:flex;flex-direction:column;gap:10px}
.citem .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.citem .meta{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;flex-wrap:wrap}
.pager .btns{display:flex;gap:6px}

/* dashboard */
.stats{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
@container app (min-width:900px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:16px 18px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.stat .d{font-size:12.5px;margin-top:2px;color:var(--muted)}
.stat .d b{color:var(--ok-text);font-weight:600}
.stat .d b.e{color:var(--err-text)}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:1100px){.dash{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.dash>div{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;min-width:0}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;padding:18px 18px 6px}
.yax,.plot{position:relative;height:180px}
.yax span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:5px}
.bar{flex:1;background:var(--ok);border-radius:4px 4px 0 0;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.bar i{display:block;background:var(--err)}
.xax{display:flex;justify-content:space-between;padding:0 18px 16px 52px;font-size:11px;color:var(--muted)}
.feed{display:flex;flex-direction:column}
.feed a{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.feed a:last-child{border-bottom:0}
.feed a:hover{background:var(--surface-2)}
.feed .who{flex:1;min-width:0}
.feed .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .who span{font-size:12px;color:var(--muted)}
.check{display:flex;flex-direction:column}
.check a{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;color:inherit;text-decoration:none}
.check a:last-child{border-bottom:0}
.check a:hover{background:var(--surface-2)}
.tick{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok-text);flex:none}
.tick svg{width:14px;height:14px;stroke-width:2.6}
.check .txt{flex:1;min-width:0}
.check .txt b{display:block;font-weight:600}
.check .txt span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

/* send */
.send-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:1180px){.send-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.preview{position:sticky;top:0}}
.send-grid>*{min-width:0}
.resume-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:10px;flex-wrap:wrap}
.resume-row .f{flex:1;min-width:0;overflow-wrap:anywhere}
.filei{display:inline-grid;place-items:center;width:38px;height:44px;border-radius:7px;background:var(--err-soft);color:var(--err-text);font-size:10px;font-weight:700;flex:none}
.mailmeta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px}
.mailmeta dt{color:var(--muted)}
.mailmeta dd{margin:0;overflow-wrap:anywhere}
.mailbody{padding:18px;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
mark{background:var(--accent-soft);color:var(--accent-text);padding:0 3px;border-radius:4px;font-weight:600}
.sticky-act{position:sticky;bottom:-28px;margin:16px -16px -28px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:2}
@container app (min-width:640px){.sticky-act{margin:16px -24px -24px;padding:12px 24px;bottom:-24px}}
@container app (min-width:1024px){.sticky-act{margin:16px -32px -36px;padding:14px 32px;bottom:-36px}}

/* history */
.hist{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:1024px){.hist{grid-template-columns:minmax(0,1fr) 360px}}
.hist .detail{display:none}
@container app (min-width:1024px){.hist .detail{display:block;position:sticky;top:0;align-self:start}}
.txrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.txrow:last-child{border-bottom:0}
.txrow:hover{background:var(--surface-2)}
.txrow[aria-selected="true"]{background:var(--primary-soft)}
.txrow .who{flex:1 1 180px;min-width:0}
.txrow .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.txrow .who span{font-size:12px;color:var(--muted)}
.kv{display:grid;gap:14px}
.kv div span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.kv div p{margin:0;overflow-wrap:anywhere}
.idrow{display:flex;gap:8px;align-items:center}
.idrow code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface-2);padding:6px 8px;border-radius:7px}
.resp{background:var(--surface-2);padding:10px 12px;border-radius:8px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}

/* templates */
.tpl{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:1024px){.tpl{grid-template-columns:300px minmax(0,1fr)}}
.tpl>*{min-width:0}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{padding:14px;cursor:pointer;text-align:left;width:100%}
.titem[aria-selected="true"]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.titem .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.titem p{margin:6px 0 0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.cbx{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.cbx input{width:16px;height:16px;accent-color:var(--primary)}

/* resumes */
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px}
.drop .big{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--primary-soft);color:var(--primary)}
.drop .big svg{width:22px;height:22px}
.drop b{font-size:15px}
.ver{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ver:last-child{border-bottom:0}
.ver .f{flex:1 1 200px;min-width:0}
.ver .f b{display:block;overflow-wrap:anywhere}
.ver .f span{font-size:12.5px;color:var(--muted)}
.ver .a{display:flex;gap:8px;align-items:center}
.import-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@container app (min-width:560px){.import-res{grid-template-columns:repeat(4,minmax(0,1fr))}}
.import-res div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.import-res b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.import-res span{font-size:12px;color:var(--muted)}
.multi{display:flex;gap:8px;align-items:center}
.multi .input{flex:1}
.multi label{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}

/* settings tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.narrow{max-width:640px}
.status-line{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;background:var(--ok-soft);margin-bottom:18px;flex-wrap:wrap}
.status-line .t{flex:1;min-width:0}
.status-line b{display:block}
.status-line span{font-size:12.5px;color:var(--muted)}

/* admin switch */
.switch{width:38px;height:22px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.role-sel{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12.5px}

/* auth */
.auth{height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);background:var(--bg)}
.auth-art{display:none}
.auth-form{display:flex;flex-direction:column;justify-content:center;padding:28px 16px;min-width:0}
.auth-box{width:100%;max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.auth-box h2{font-size:26px}
.auth-box .sub{color:var(--muted);margin:-8px 0 4px}
.auth-mbrand{margin-bottom:8px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pw{position:relative}
.pw .input{padding-right:58px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12.5px}
.otp{display:flex;gap:8px}
.otp input{width:100%;min-width:0;max-width:52px;aspect-ratio:1/1.1;text-align:center;font-size:20px;font-family:var(--mono);border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none}
.otp input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.stepper{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.stepper i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.stepper i.on{background:var(--primary)}
.meter{display:flex;gap:4px;margin-top:2px}
.meter i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.gbtn svg{width:18px;height:18px}
@container app (min-width:900px){
  .auth{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

  .auth-mbrand{display:none}
}

.flow{display:flex;flex-direction:column;gap:10px;max-width:400px}

  return `<div class="kv">

    <div><span>Recipient</span><p class="mono">${t[1]}</p></div>
    <div><span>Request ID</span><div class="idrow"><code class="mono">${t[0]}</code><button class="icon-btn" data-act="copy:${t[0]}" aria-label="Copy request ID">${ic('copy')}</button></div></div>
    <div><span>Sent at</span><p class="num">${t[6]}</p></div>
    ${t[4]?`<div><span>Error code</span><p><span class="pill err plain mono">${t[4]}</span></p></div>`:''}
    <div><span>Server response</span><div class="resp">${esc(t[5])}</div></div>
    ${f?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-go="${f[1]}">${f[0]}</button><button class="btn">${ic('refresh')}Retry</button></div>`:''}
  </div>`;
}

const MODALS = {
add(){ return `<div class="sheet-head"><div><h3>Add HR contact</h3><p class="muted" style="margin:2px 0 0">A contact can have several emails and phone numbers.</p></div><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="fgrid two">
    <div class="field span2"><label for="n_name">Full name</label><input class="input" id="n_name" placeholder="e.g. Kavya Menon"></div>
    <div class="field"><label for="n_title">Title</label><input class="input" id="n_title" placeholder="Talent Acquisition Lead"></div>
    <div class="field"><label for="n_company">Company</label><input class="input" id="n_company" placeholder="Zoho"></div>
    <div class="field span2"><label>Emails</label>
      <div class="multi"><input class="input" id="n_e1" placeholder="name@company.com" aria-label="Email 1"><label><input type="radio" name="pe" checked>Primary</label></div>
      <div class="multi"><input class="input" id="n_e2" placeholder="Another email (optional)" aria-label="Email 2"><label><input type="radio" name="pe">Primary</label></div>
      <button class="link" style="align-self:flex-start">+ Add another email</button></div>
    <div class="field span2"><label for="n_p1">Phone <span class="muted">(optional)</span></label><input class="input" id="n_p1" placeholder="98450 12345"><button class="link" style="align-self:flex-start">+ Add another phone</button></div>
  </div>
  <div class="sheet-foot"><button class="btn" data-act="close">Cancel</button><button class="btn btn-primary" data-act="toast:Contact added">Add contact</button></div>`; },
import(){ return `<div class="sheet-head"><div><h3>Import contacts</h3><p class="muted" style="margin:2px 0 0">Upload an Excel sheet or a PDF list of recruiters.</p></div><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="drop" data-act="imported" style="cursor:pointer"><span class="big">${ic('upload')}</span><b>Drop a file here</b><span class="muted">.xlsx or .pdf · columns: name, email, title, company, phone</span></div>
  ${S.imported?`<div class="callout" style="margin-top:14px">${ic('check')}<div><b>hr_list_october.xlsx processed</b></div></div>
  <div class="import-res"><div><b>312</b><span>rows read</span></div><div><b>287</b><span>added</span></div><div><b>19</b><span>already saved</span></div><div><b>6</b><span>invalid email</span></div></div>`:''}
  <div class="sheet-foot"><button class="btn" data-act="close">${S.imported?'Done':'Cancel'}</button>${S.imported?'<button class="btn">Download skipped rows</button>':''}</div>`; },
tx(){ return `<div class="sheet-head"><h3>Send details</h3><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>${txDetail(TX[S.tx])}`; },
};

/* ---------- auth ---------- */
function authArt(){
  return `<div class="auth-art"><div>${brand()}<h1>Reach recruiters from your own inbox.</h1><p>Keep your HR contacts in one place, send personalised cold emails with your resume attached, and see which ones landed.</p></div>
    <div class="flow"><div><em>1</em><div><b>Add contacts</b><span>Type them in or import an Excel or PDF list.</span></div></div>
    <div><em>2</em><div><b>Pick a template and resume</b><span>Variables like hr_name fill in for each person.</span></div></div>
    <div><em>3</em><div><b>Send and track</b><span>Every send is logged with the server's reply.</span></div></div></div></div>`;
}
const pwField = (id,label,ph='At least 8 characters') => `<div class="field"><label for="${id}">${label}</label><div class="pw"><input class="input" id="${id}" type="password" placeholder="${ph}"><button class="link" data-act="peek:${id}">Show</button></div></div>`;
const AUTH = {
login(){ return `<h2>Welcome back</h2><p class="sub">Sign in to continue your outreach.</p>
  <div class="field"><label for="l_email">Email</label><input class="input" id="l_email" type="email" value="${ME.email}"></div>
  ${pwField('l_pw','Password')}
  <div class="row-between"><label class="cbx"><input type="checkbox" id="l_rem" checked>Keep me signed in</label><button class="link" data-go="forgot">Forgot password?</button></div>
  <button class="btn btn-primary btn-block" data-go="dashboard">Sign in</button>
  <div class="divider">or</div>
  <button class="btn btn-block gbtn">${G}Continue with Google</button>
  <p class="muted" style="text-align:center;margin:0">New to ColdReach? <button class="link" data-go="signup">Create an account</button></p>`; },
signup(){
  const st = `<div class="stepper">${[1,2,3].map(n=>`<i class="${n<=S.step?'on':''}"></i>`).join('')}<span style="margin-left:6px">Step ${S.step} of 3</span></div>`;
  if (S.step===1) return st+`<h2>Create your account</h2><p class="sub">We'll send a code to verify your email.</p>
    <div class="field"><label for="s_name">Full name</label><input class="input" id="s_name" value="Saurabh A."></div>
    <div class="field"><label for="s_email">Email</label><input class="input" id="s_email" type="email" value="${ME.email}"></div>
    <div class="field"><label for="s_mobile">Mobile</label><input class="input" id="s_mobile" value="98765 43210"><span class="hint">10–15 digits. Not verified, used only on your emails.</span></div>
    <button class="btn btn-primary btn-block" data-act="step:2">Send verification code</button>
    <div class="divider">or</div><button class="btn btn-block gbtn">${G}Sign up with Google</button>
    <p class="muted" style="text-align:center;margin:0">Already have an account? <button class="link" data-go="login">Sign in</button></p>`;
  if (S.step===2) return st+`<h2>Check your email</h2><p class="sub">Enter the 6-digit code sent to <b>${ME.email}</b>.</p>
    <div class="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" id="otp${i}" aria-label="Digit ${i+1}">`).join('')}</div>
    <div class="row-between"><span class="muted">Code expires in <b class="num">09:41</b></span><button class="link">Resend code</button></div>
    <button class="btn btn-primary btn-block" data-act="step:3">Verify email</button>
    <button class="link" data-act="step:1">${'← Change email'}</button>`;
  return st+`<h2>Set a password</h2><p class="sub">Your email is verified. One last step.</p>
    ${pwField('s_pw','Password')}
    <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div><span class="hint muted" id="meterTxt" style="margin-top:-10px;font-size:12px">Use 8+ characters with a number and a symbol.</span>
    ${pwField('s_pw2','Confirm password','Type it again')}
    <button class="btn btn-primary btn-block" data-go="dashboard">Create account</button>`;
},
forgot(){
  if (S.fstep===1) return `<h2>Reset your password</h2><p class="sub">Enter your account email and we'll send a 6-digit code.</p>
    <div class="field"><label for="f_email">Email</label><input class="input" id="f_email" type="email" value="${ME.email}"></div>
    <button class="btn btn-primary btn-block" data-act="fstep:2">Send code</button>
    <button class="link" data-go="login">← Back to sign in</button>`;
  return `<h2>Choose a new password</h2><p class="sub">Code sent to <b>${ME.email}</b>.</p>
    <div class="field"><label for="otp0">Code</label><div class="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" id="otp${i}" aria-label="Digit ${i+1}">`).join('')}</div></div>
    ${pwField('f_pw','New password')}
    <button class="btn btn-primary btn-block" data-go="login">Reset password</button>
    <button class="link" data-act="fstep:1">← Use a different email</button>`;
},
};
function authShell(){
  return `<div class="auth">${authArt()}<div class="auth-form"><div class="auth-box"><div class="auth-mbrand">${brand()}</div>${AUTH[S.screen]()}</div></div></div>`;
}

/* ---------- render + events ---------- */
const root = document.getElementById('root');
function render(keepScroll){
  const m = document.getElementById('main'), y = m ? m.scrollTop : 0;
  const isAuth = ['login','signup','forgot'].includes(S.screen);
  root.innerHTML = isAuth ? authShell() : shell();
  if (keepScroll && document.getElementById('main')) document.getElementById('main').scrollTop = y;
  document.getElementById('jump').value = S.screen;
  document.getElementById('protoTheme').innerHTML = themeIcon();
}
document.getElementById('jump').innerHTML = SCREENS.map(([id,l,a])=>`<option value="${id}">${a?'Auth · ':''}${l}</option>`).join('');
document.getElementById('jump').addEventListener('change', e => { S.screen=e.target.value; S.step=1; S.fstep=1; S.modal=null; S.drawer=false; render(); });

function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>{t.hidden=true},2200);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el) return;
  if (el.dataset.act==='close' && e.target.closest('[data-stop]') && !e.target.closest('button[data-act="close"]')) return;
  if (el.dataset.go){ e.preventDefault(); S.screen=el.dataset.go; S.drawer=false; S.modal=null; S.step=1; S.fstep=1; render(); return; }
  const [a,v] = el.dataset.act.split(/:(.*)/s);
  switch(a){
    case 'size': document.getElementById('device').dataset.size=v; document.querySelectorAll('[data-act^="size:"]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.act==='size:'+v)); return;
    case 'theme': document.documentElement.dataset.theme = effectiveTheme()==='dark'?'light':'dark'; render(true); return;
    case 'menu': S.drawer=true; break;
    case 'close': S.drawer=false; S.modal=null; S.imported=false; break;
    case 'modal': S.modal=v; break;
    case 'step': S.step=+v; break;
    case 'fstep': S.fstep=+v; break;
    case 'hist': S.hist=v; break;
    case 'tx': S.tx=+v; if(!isWide()) S.modal='tx'; break;
    case 'opentx': S.tx=+v; S.modal='tx'; break;
    case 'tpl': S.tpl=+v; break;
    case 'set': S.set=v; break;
    case 'mode': S.mode=v; break;
    case 'imported': S.imported=true; break;
    case 'usw': S.users[+v].on=!S.users[+v].on; break;
    case 'send': toast(S.mode==='single'?'Email sent to Priya Sharma':'Sending to 1,186 contacts…'); return;
    case 'toast': S.modal=null; render(true); toast(v); return;
    case 'peek': { const i=document.getElementById(v); i.type = i.type==='password'?'text':'password'; el.textContent = i.type==='password'?'Show':'Hide'; return; }
    case 'copy': navigator.clipboard?.writeText(v).then(()=>toast('Request ID copied'), ()=>toast('Select the ID to copy it')); return;
  }
  render(true);
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.classList.contains('txrow')) e.target.click(); if(e.key==='Escape' && (S.modal||S.drawer)){S.modal=null;S.drawer=false;render(true);} });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id && t.id.startsWith('otp') && t.value){ const n=document.getElementById('otp'+(+t.id.slice(3)+1)); if(n) n.focus(); }
  if (t.id==='s_pw'){
    const v=t.value; let s=0; if(v.length>=8)s++; if(/\d/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++; if(v.length>=12&&/[A-Z]/.test(v))s++;
    const c = ['var(--line)','var(--err)','var(--warn)','var(--ok)','var(--ok)'][s];
    document.querySelectorAll('#meter i').forEach((b,i)=>b.style.background = i<s?c:'var(--line)');
    document.getElementById('meterTxt').textContent = ['Use 8+ characters with a number and a symbol.','Weak','Okay','Strong','Very strong'][s];
  }
});
document.addEventListener('change', e => { if(e.target.dataset.role){ S.users[+e.target.dataset.role].role=e.target.value; } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>render(true));
render();
</script>

</html>
